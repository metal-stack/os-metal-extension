---
name: Test Action
on:
  pull_request:
    branches:
      - master
  release:
    types:
      - published
  push:
    branches:
      - master

jobs:
  build:
    name: Test Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Set up Go 1.26
      uses: actions/setup-go@v6
      with:
        go-version: '1.26.x'

    - name: Check (lint) and Test
      run: |
        mkdir -p hack/tools/bin
        make test-in-docker
